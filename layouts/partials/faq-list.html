{{- /* 原站 #680 /11/1/0 toggle widget：简单分隔线手风琴，首项默认展开 */ -}}
<div class="divide-y divide-ink-100 border-t border-ink-100">
  {{ range $i, $item := site.Data.faq }}
  <details class="group px-1 py-5" {{ if eq $i 0 }}open{{ end }}>
    <summary class="flex cursor-pointer list-none items-start justify-between gap-4 text-base font-semibold text-ink-900 marker:hidden">
      <span>{{ .q }}</span>
      <span class="mt-0.5 shrink-0 text-xl leading-none text-brand-500 transition group-open:rotate-45" aria-hidden="true">+</span>
    </summary>
    <div class="mt-3 space-y-2 text-sm leading-relaxed text-ink-500">
      {{ range .a }}<p class="m-0">{{ . }}</p>{{ end }}
    </div>
  </details>
  {{ end }}
</div>
