{{- $p := site.Data.sections.popup -}}
<div class="mb-9 rounded-2xl border border-brand-100 bg-brand-50 p-7 sm:p-9">
  <p class="eyebrow">{{ $p.eyebrow }}</p>
  <h2 class="mt-2 m-0 text-2xl font-bold tracking-tight text-ink-900 sm:text-3xl">{{ $p.heading }}</h2>
  <p class="mt-4 m-0 text-base leading-relaxed text-ink-700">{{ $p.body }}</p>
  <p class="mt-4 m-0 text-base font-semibold text-ink-900">{{ $p.lead }}</p>
</div>
