{{- $t := site.Data.thankyou -}}
<div class="mx-auto max-w-3xl text-center">
  <h1 class="text-3xl font-bold tracking-tight text-ink-900 sm:text-4xl">{{ $t.heading }}</h1>
  <p class="mt-5 text-base leading-relaxed text-ink-500">{{ $t.lead }}</p>

  <div class="mt-10 grid gap-6 text-left sm:grid-cols-2">
    <div class="rounded-2xl border border-ink-100 bg-white p-6 shadow-sm">
      <p class="m-0 text-sm leading-relaxed text-ink-500">{{ $t.urgent }}</p>
      <img src="{{ $t.qr }}" alt="{{ $t.qrAlt }}" width="400" height="500" loading="lazy"
           class="mx-auto mt-5 w-full max-w-[220px] rounded-lg border border-ink-100 object-contain">
    </div>

    <div class="flex flex-col items-start rounded-2xl border border-ink-100 bg-white p-6 shadow-sm">
      <a href="{{ $t.catalog }}" class="btn-primary mt-auto no-underline hover:no-underline" download>{{ $t.catalogLabel }}</a>
      <p class="mt-3 m-0 text-xs text-ink-500">PDF · 12.4 MB</p>
    </div>
  </div>

  <p class="mt-10 text-sm"><a href="/" class="font-semibold">← Back to home</a></p>
</div>
